services:
  opa:
    image: openpolicyagent/opa:0.68.0
    container_name: secops-opa
    command: run --server --watch --addr=0.0.0.0:8181 /policies
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro

  gateway:
    image: python:3.11-slim
    container_name: secops-gateway
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python gateway/app.py"
    ports:
      - "8080:5000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OPA_URL=http://opa:8181/v1/data/secops/gateway
    volumes:
      - .:/app
    depends_on:
      - opa